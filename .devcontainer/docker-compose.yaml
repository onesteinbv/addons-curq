version: "3.8"

services:
  curq:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspace:cached
      - odoo-data:/odoo-data
    command: sleep infinity
    network_mode: service:postgres

  postgres:
    image: postgres:13
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: odoo
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: odoo

volumes:
  postgres-data:
  odoo-data:
