name: test-migration

on:
  workflow_call:
    inputs:
      from:
        required: true
        type: string
      to:
        required: true
        type: string
  workflow_dispatch:
    inputs:
        git_commit:
          required: true
          type: string
        pr:
          required: false
          type: number

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      statuses: write    
    services:
      postgres:
        image: postgres:13.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - name: "Update status: pending"
        uses: actions/github-script@v7
        if: ${{ inputs.git_commit != '' }}
        with:
          script: |
            github.rest.repos.createCommitStatus({
              sha: "${{ inputs.git_commit }}",
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "pending",
              context: "ci/migration-test"
              description: "Running...",
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            })
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
      - name: Setup GitHub env variables
        run: |
          if [ -z "${{ inputs.from }}" ]; then
            echo "FROM=ghcr.io/${{ github.repository_owner }}/curq-ci:16.0" >> $GITHUB_ENV
            echo "TO=ghcr.io/${{ github.repository_owner }}/curq-ci:${{ inputs.git_commit }}" >> $GITHUB_ENV
          else
            echo "FROM=${{ inputs.from }}" >> $GITHUB_ENV
            echo "TO=${{ inputs.to }}" >> $GITHUB_ENV
          fi
      - name: Prepare env files
        run: |
          MODULES=$(docker run ${{ env.FROM }} -c "manifestoo -d /odoo/custom list | grep _install | paste -sd,")
          cat > .env.base <<EOF
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=odoo
          DB_PASSWORD=odoo
          MODULES=$MODULES
          WORKERS=0
          MODE=InstallOnly
          DOCKER=true
          DB_NAME=main
          DB_FILTER=^main$
          EOF
      - name: Initialize ${{ env.FROM }}
        run: |
          docker volume create fs
          docker run \
            --volume fs:/odoo/data \
            --network=host \
            --entrypoint /usr/local/bin/entrypoint.sh \
            --env-file .env.base \
            ${{ env.FROM }}
      - name: Test update
        run: |
          docker run \
            --volume fs:/odoo/data \
            --network=host \
            --entrypoint /usr/local/bin/entrypoint.sh \
            --env-file .env.base \
            --env MODE=UpdateOnly \
            ${{ env.TO }}
      - name: "Update status: success"
        uses: actions/github-script@v7
        if: ${{ success() && inputs.git_commit != '' }}
        with:
          script: |
              github.rest.repos.createCommitStatus({
                sha: "${{ inputs.git_commit }}",
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "success",
                context: "ci/migration-test"
                description: "Migration succeeded",
                target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              })
      - name: "Update status: failure"
        uses: actions/github-script@v7
        if: ${{ failure() && inputs.git_commit != '' }}
        with:
          script: |
              github.rest.repos.createCommitStatus({
                sha: "${{ inputs.git_commit }}",
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "failure",
                context: "ci/migration-test"
                description: "Migration failed",
                target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              })                
