name: build

on:
  workflow_call:
    inputs:
      tags:
        required: true
        type: string
      target:
        default: "base"
        type: string
      use_pat:
        type: boolean
        default: false
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker
        uses: docker/login-action@v3
        if: ${{ !inputs.use_pat }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker
        uses: docker/login-action@v3    
        if: ${{ inputs.use_pat }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ inputs.tags }}
          target: ${{ inputs.target }}
